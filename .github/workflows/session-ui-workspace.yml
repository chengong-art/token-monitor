name: Session UI workspace
on:
  push:
    branches: [work/session-ui-build-20261005]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle public source and offline test dependencies
        run: |
          tar --exclude=.git --exclude=node_modules/.cache -czf /tmp/session-ui-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: session-ui-workspace
          path: /tmp/session-ui-workspace.tgz
          retention-days: 1
